[package]
name = "telorgon-settings-app"
version = "0.1.0"
edition = "2024"

[dependencies]
telorgon = { path = "../telorgon/crates/telorgon", features = ["desktop-settings-linux", "networkmanager-linux"] }
futures-lite = "2"
async-io = "2.6"
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

# Keep application debugging while making large-image pixel and codec work fast.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package."miniz_oxide@0.8.9"]
opt-level = 3

[profile.dev.package."miniz_oxide@0.9.1"]
opt-level = 3
